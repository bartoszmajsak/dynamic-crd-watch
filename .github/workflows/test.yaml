name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMG: localhost/dynamic-crd-watch:test

jobs:
  unit:
    name: envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3

      - name: Run tests (embedded apiserver, in-process manager)
        run: mise run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        

      - name: Create kind cluster
        run: |
          mise kind:create

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image into kind
        run: kind load docker-image $IMG --name dynamic-crd-watch

      - name: Deploy controller
        run: IMG=$IMG mise deploy

      - name: Wait for controller readiness
        run: |
          kubectl wait --for=condition=available --timeout=120s \
            deployment/dynamic-watch-poc-controller-manager \
            -n dynamic-watch-poc-system

      - name: Run e2e tests (real cluster, deployed manager)
        run: |
          mise test:e2e
