version: "2"
run:
  timeout: 5m
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - forbidigo
    - funlen
    - funcorder
    - gochecknoglobals
    - gocognit
    - godoclint
    - godox
    - gomoddirectives
    - mnd
    - nestif
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - tagliatelle
    - varnamelen
    - wrapcheck
    - gochecknoinits
    - ireturn
    - wsl
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: true
    goconst:
      ignore-string-values:
        - "true"
        - "false"
    gocritic: {}
    gocyclo:
      min-complexity: 30
    importas:
      alias:
        - pkg: k8s.io/api/(\w{1,4})\w*/(v[\w\d]+)
          alias: $1$2
    lll:
      line-length: 180
    nolintlint:
      require-specific: true
      allow-no-explanation:
        - funlen
        - lll
    perfsprint:
      sprintf1: false
      strconcat: false
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
                - github.com/onsi/gomega/gstruct
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
        path: _test\.go
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/bartoszmajsak/dynamic-watch-poc)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
